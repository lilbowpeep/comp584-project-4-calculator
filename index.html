<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculator App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="wrapper">
      <section class="calculator-screen" aria-label="Calculator display" aria-live="polite">0</section>
      <section class="calculator-buttons" aria-label="Calculator buttons">
        <button type="button" class="clear">C</button>
        <button type="button" aria-label="Backspace">&larr;</button>
        <button type="button" class="operator" aria-label="Divide">&divide;</button>
        <button type="button">7</button>
        <button type="button">8</button>
        <button type="button">9</button>
        <button type="button" class="operator" aria-label="Multiply">&times;</button>
        <button type="button">4</button>
        <button type="button">5</button>
        <button type="button">6</button>
        <button type="button" class="operator" aria-label="Subtract">-</button>
        <button type="button">1</button>
        <button type="button">2</button>
        <button type="button">3</button>
        <button type="button" class="operator" aria-label="Add">+</button>
        <button type="button" class="zero">0</button>
        <button type="button" class="operator" aria-label="Equals">=</button>
      </section>
    </div>
  </body>
</html>
